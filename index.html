export default {
  async fetch(request) {
    const originUrl = "https://lozix94-afk.github.io/hahadicexd/"; 
    const response = await fetch(originUrl);
    const html = await response.text();

    return new Response(html, {
      headers: {
        "Content-Type": "text/plain", 
        "Content-Disposition": "inline"
      }
    });
  }
};
